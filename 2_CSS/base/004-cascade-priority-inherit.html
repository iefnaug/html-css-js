<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cascade-priority-inherit</title>
    <style>
        body {
            color: green;
        }

        .my-class-1 a {
            color: inherit;
        }

        .my-class-2 a {
            color: initial;
        }

        .my-class-3 a {
            color: unset;
        }

    </style>
</head>
<body>
    <ul>
        <li>默认<a href="#">链接</a>颜色</li>
        <li class="my-class-1">继承<a href="#">链接</a>颜色</li>
        <li class="my-class-2">重置<a href="#">链接</a>颜色</li>
        <li class="my-class-3">取消<a href="#">链接</a>颜色的设置</li>
    </ul>

</body>
</html>
