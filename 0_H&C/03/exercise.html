<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>buttons</title>
</head>
<style>
    .request-button {
        background-color: #0F0F0F;
        color: white;
        font-size: 16px;
        font-weight: bold;
        height: 46px;
        width: 160px;
        border: none;
        transition: opacity 0.2s;
    }
    .request-button:hover {
        opacity: 0.9;
    }
    .request-button:active {
        opacity: 0.8;
    }
</style>
<body>
    <button class="request-button">Request now</button>
</body>
</html>
