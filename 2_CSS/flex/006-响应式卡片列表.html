<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .card-list {
            display: flex;
            flex-flow: row wrap;
            gap: 20px;
        }

        .card {
            flex: 1 1 200px;
            height: 180px;
            background-color: #22c55e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
<div class="card-list">
    <div class="card">商品1</div>
    <div class="card">商品2</div>
    <div class="card">商品3</div>
    <div class="card">商品4</div>
    <div class="card">商品5</div>
</div>
</body>
</html>
