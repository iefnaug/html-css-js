<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .logo {
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 50%;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            color: lightskyblue;
            background-color: lightblue;
        }

        .menu {
            width: 1000px;
            /*height: 100px;*/
            border: 2px dashed lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            gap: 16px;
            /*justify-content: center;*/
        }

        .menu a {
            min-width: 100px;
            max-width: 150px;
            height: 50px;
            line-height: 50px;
            background-color: #609275;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            color: white;
            flex: 1;
        }

        .menu a:hover {
            color: lightsalmon;
        }

        .menu :nth-child(5) {
            margin-left: auto;
        }

    </style>
</head>
<body>
<header class="nav">
    <div class="logo">Logo</div>
    <nav class="menu">
        <a href="#">首页</a>
        <a href="#">电视剧</a>
        <a href="#">综艺</a>
        <a href="#">电影</a>
        <a href="#">登录</a>
    </nav>
</header>
</body>
</html>
