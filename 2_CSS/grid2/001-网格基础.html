<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .container {
            width: 600px;
            /*height: 200px;*/
            display: grid;
            /*grid-template-columns: 200px 200px 200px;*/
            /*grid-template-columns: 1fr 1fr 1fr;*/
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: minmax(200px, auto);
            column-gap: 25px;
            row-gap: 50px;
        }
        .container > div {
            /*width: 180px;*/
            /*height: 100px;*/
            background-color: #609275;
        }
        .box {
            /*网格线定位*/
            grid-column: 2/4;
            grid-row: 1/3;
            display: grid;
            grid-template-rows: repeat(3, 1fr);
        }

        .box > div {
            background-color: #3b82f6;
        }

    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div class="box">
            <div>a</div>
            <div>b</div>
            <div>c</div>
        </div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>
</html>
