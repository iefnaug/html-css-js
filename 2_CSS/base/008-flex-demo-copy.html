<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../style/flex2.css">
</head>
<body>
<header>
    <div class="logo">Logo</div>
    <div class="search"><input type="text" placeholder="Search.."></div>
    <div class="user">
        <div>GF</div>
        <div class="avatar"></div>
    </div>
</header>
<main>
    <nav>
        <div class="menu-item">首页</div>
        <div class="menu-item">用户管理</div>
        <div class="menu-item">订单管理</div>
        <div class="menu-item">数据统计</div>
        <div class="menu-item logout">退出</div>
    </nav>
    <div class="main-content">
        <div class="cards">
            <div class="card active">
                <div class="first-line">
                    <div>重点指标</div><div>🔥</div>
                </div>
                <div class="number">9999</div>
            </div>
            <div class="card">
                <div class="first-line">
                    <div>今日用户</div><div>👤</div>
                </div>
                <div class="number">1800</div>
            </div>
            <div class="card">
                <div class="first-line">
                    <div>订单量</div><div>📦</div>
                </div>
                <div class="number">500</div>
            </div>
            <div class="card">
                <div class="first-line">
                    <div>销售额</div><div>💰</div>
                </div>
                <div class="number">$79000</div>
            </div>
        </div>

        <div class="table">
            <div class="table-head">
                <div class="user-list">用户列表</div>
                <div class="operation">
                    <div>新增</div>
                    <div>导出</div>
                </div>
            </div>
            <div class="table-row">
                <div>1</div>
                <div>张三</div>
                <div>管理员</div>
                <div>在线</div>
            </div>
            <div class="table-row">
                <div>1</div>
                <div>张三</div>
                <div>管理员</div>
                <div>在线</div>
            </div>
            <div class="table-row">
                <div>1</div>
                <div>张三</div>
                <div>管理员</div>
                <div>在线</div>
            </div>
            <div class="table-row">
                <div>1</div>
                <div>张三</div>
                <div>管理员</div>
                <div>在线</div>
            </div>
        </div>
    </div>
</main>
<footer>
    <div class="tag">@Copyright</div>
</footer>
</body>
</html>
