<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>flex-item</title>
    <style>
        .container {
            display: flex;
            /*align-items: start;*/
            background-color: dodgerblue;
            height: 200px;
        }

        .container div {
            background-color: #f1f1f1;
            color:#000;
            width: 100px;
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="flex-grow: 1;">1</div>
        <div style="flex-grow: 2">2</div>
        <div style="flex-grow: 3; align-self: center;">3</div>
<!--
flex = flex-grow(拉伸比例, 默认值0，不拉升) flew-shrink(压缩比例，默认值1，等值压缩) flex-basis(初始大小)
-->
        <div style="flex: 4 0 250px">4</div>
    </div>
</body>
</html>
