<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .btn {
            color: white;
            background-color: #027d0f;
            font-weight: bold;
            padding: 12px 24px 12px 24px;
            margin-left: 10px;
            margin-right: 10px;
            border: none;
            transition: padding 0.2s, font-size 0.2s;
        }
        .btn:hover {
            font-size: 1.5em;
            padding: 15px 30px 15px 30px;
        }
    </style>
</head>
<body>
    <button class="btn">Stretch</button>
</body>
</html>
