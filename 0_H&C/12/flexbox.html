<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>flexbox</title>
    <style>
        .container {
            width: 666px;
            display: flex;
            flex-direction: row;
            margin-bottom: 10px;
        }
        .item1 {
            background-color: #609275;
        }

        .item2 {
            background-color: #ff6700;
        }

        .item3 {
            flex: 1;
            background-color: #ff6700;
        }

        .item4 {
            flex: 2;
            background-color: #667eea;
        }

        .item5 {
            width: 100px;
            background-color: #764ba2;
        }

        .container2 {
            height: 100px;
            width: 666px;
            border: 1px solid #609275;
            display: flex;
            flex-direction: row;
            /*水平方向，默认*/
            /*justify-content: start;*/
            /*justify-content: end;*/
            /*justify-content: center;*/
            justify-content: space-between;

            /*垂直方向，默认*/
            /*align-items: stretch;*/
            /*align-items: start;*/
            /*align-items: end;*/
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">div1</div>
        <div class="item2">div2</div>
    </div>

    <div class="container">
        <div class="item3">flex1</div>
        <div class="item4">flex2</div>
    </div>

    <div class="container2">
        <div class="item5">test</div>
        <div class="item5">test</div>
        <div class="item5">test</div>
    </div>
</body>
</html>
