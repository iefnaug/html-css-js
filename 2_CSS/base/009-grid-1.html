<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 100px;
            row-gap: 10px;
            column-gap: 20px;
        }

        .box1 {
            /*grid-column-start: 1;*/
            /*grid-column-end: 4;*/
            grid-column: 1/4;

            /*grid-row-start: 1;*/
            /*grid-row-end: 3;*/
            grid-row: 1/3;
        }

        .box2 {
            grid-column-start: 1;
            grid-row-start: 3;
            grid-row-end: 5;
        }
        * {
            box-sizing: border-box;
        }

        .wrapper {
            border: 2px solid #f76707;
            border-radius: 5px;
            background-color: #fff4e6;
        }

        .wrapper > div {
            border: 2px solid #ffa94d;
            border-radius: 5px;
            background-color: #ffd8a8;
            padding: 1em;
            color: #d9480f;
        }


    </style>
</head>
<body>
<div class="wrapper">
    <div class="box1">一</div>
    <div class="box2">二</div>
    <div class="box3">三</div>
    <div class="box4">四</div>
    <div class="box5">五</div>
</div>
</body>
</html>
