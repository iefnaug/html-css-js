<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .btn {
            color: white;
            background-color: #027d0f;
            font-weight: bold;
            padding: 12px 24px 12px 24px;
            margin-left: 10px;
            margin-right: 10px;
            border: none;
            transition: box-shadow 0.1s;
        }
        .btn:hover {
            box-shadow: 5px 5px 5px #4D4C4CFF;
        }
    </style>
</head>
<body>
    <button class="btn">Shadow</button>
</body>
</html>
