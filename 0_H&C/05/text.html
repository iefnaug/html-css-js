<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            /*text-align: center;*/

            line-height: 24px;
            margin-bottom: 5px;
        }
        .video-stats {
            color: rgb(96, 96, 96);
            margin-bottom: 20px;
        }
        .video-author {

            color: rgb(96, 96, 96);
        }
        .video-description {
            color: rgb(96, 96, 96);
            width: 280px;
            line-height: 20px;
            margin-top: 20px;
            margin-bottom: 80px;
        }

            background-color: rgb(227, 65, 64);

            text-align: center;

        }

            text-decoration: none;

        }

            text-decoration: underline;
            cursor: pointer;
        }

</head>
