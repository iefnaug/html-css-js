<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>flex-wrap\</title>
    <style>
        .box {
            width: 500px;
            border: 2px dotted rgb(96 139 168);
            display: flex;
            flex-wrap: wrap;
        }

        .box > * {
            border: 2px solid rgb(96 139 168);
            border-radius: 5px;
            background-color: rgb(96 139 168 / 0.2);
            /*flex: 1 1 160px;*/
            flex: 1 1 100px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
        <div>Five</div>
        <div>Six</div>
        <div>Seven</div>
        <div>Eight</div>
        <div>Nine</div>
        <div>Ten</div>
    </div>
</body>
</html>
