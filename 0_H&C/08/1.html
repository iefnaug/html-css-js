<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .info-wrapper {
            margin-bottom: 5px;
        }
        .info {
            margin-left: 5px;
            text-indent: .5em;
            width: 200px;
            height: 30px;
            border-radius: 5px;
            outline: none;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<div class="info-wrapper">
    <label for="name">Name</label><input class="info" type="text" name="name" id="name" placeholder="name">
</div>
<div class="info-wrapper">
    <label for="email">Email</label><input class="info" type="email" name="email" id="email" placeholder="email">
</div>
</body>
</html>
