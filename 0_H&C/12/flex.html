<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>flex</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .wrapper {
            display: grid;
            /*grid-template-columns: 200px 200px 200px;*/
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-rows: 100px;

            /*grid-template-rows: repeat(3, 1fr);*/
            /*grid-auto-columns: 300px;*/

            border: 2px solid #f76707;
            border-radius: 5px;
            background-color: #fff4e6;
        }

        .wrapper > div {
            border: 2px solid #ffa94d;
            border-radius: 5px;
            background-color: #ffd8a8;
            padding: 1em;
            color: #d9480f;
        }

        .wrapper2 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-rows: minmax(100px, auto);

            margin-top: 20px;
            padding: 10px;
            border: 2px solid #f76707;
            border-radius: 5px;
            background-color: #fff4e6;
        }

        .wrapper2 > div {
            border: 1px solid #f76707;
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <div class="wrapper">
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
    </div>

    <div class="wrapper2">
        <div>一</div>
        <div>
            二
            <p>这里有更多内容。</p>
            <p>这里有更多内容。</p>
            <p>这里有更多内容。</p>
            <p>使得这里高于 100 像素。</p>
        </div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
    </div>
</body>
</html>
