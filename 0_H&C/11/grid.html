<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>grid</title>
    <style>
        .container {
            display: grid;
            /*grid-template-columns: 100px 200px;*/
            grid-template-columns: 100px 1fr;
            margin-bottom: 30px;
            grid-column-gap: 10px;
        }
        .lightblue {
            background-color: lightblue;
        }
        .lightcoral {
            background-color: lightcoral;
        }
        .lightgreen {
            background-color: lightgreen;
        }

        .container2 {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            grid-column-gap: 10px;
            grid-row-gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lightblue">1</div>
        <div class="lightcoral">2</div>
        <div class="lightgreen">3</div>
    </div>

    <div class="container2">
        <div class="lightblue">1</div>
        <div class="lightcoral">2<p>more</p></div>
        <div class="lightgreen">3</div>
        <div class="lightgreen">4</div>
    </div>
</body>
</html>
