<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>value-unit</title>
    <style>
        .box {
            background-color: lightblue;
            border: 5px solid darkblue;
            padding: 10px;
            margin: 1em 0;
        }

        .wrapper {
            font-size: 1em;
        }

        .px {
            width: 200px;
        }

        .vw {
            width: 10vw;
        }

        .em {
            width: 10em;
        }

        /*
        ------------------------------------------------------ the difference between em and rem
         */
        html {
            font-size: 16px;
        }

        .ems li {
            font-size: 1.3em;
        }

        .rems li {
            font-size: 1.3em;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="box px">我的宽度为 200px</div>
        <div class="box vw">我的宽度为 10vw</div>
        <div class="box em">我的宽度为 10em</div>
    </div>

    <hr/>

    <ul class="ems">
        <li>一</li>
        <li>二
        <li>
            三
            <ul>
                <li>三 A</li>
                <li>
                    三 B
                    <ul>
                        <li>三 B 2</li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>

    <ul class="rems">
        <li>一</li>
        <li>二</li>
        <li>
            三
            <ul>
                <li>三 A</li>
                <li>
                    三 B
                    <ul>
                        <li>三 B 2</li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>
</body>
</html>
