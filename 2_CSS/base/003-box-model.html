<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>box-model</title>
    <style>
        html {
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }

        .m1 {
            width: 100px;
            height: 100px;
            margin-bottom: 50px;
            /*margin-bottom: 0;*/
            background-color: #764ba2;
        }

        .m2 {
            width: 100px;
            height: 100px;
            margin-left: 20px;
            margin-top: -80px;
            background-color: #609275;
        }


        p {
            border: 2px solid rebeccapurple;
            width: 200px;
        }
        span {
            margin: 20px;
            padding: 20px;
            width: 80px;
            height: 150px;
            background-color: lightblue;
            border: 2px solid blue;
        }


    </style>
</head>
<body>
    <div class="m1"></div>
    <div class="m2"></div>


    <p>
        I am a paragraph and this is a <span>span</span> inside that paragraph. A span
        is an inline element and so does not respect width and height.
    </p>
</body>
</html>
