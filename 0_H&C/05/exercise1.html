<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .p1 {
            width: 100%;
            text-align: center;
            margin: 10px auto 10px;
            color: #ff6700;
            font-weight: bold;
        }
        .p2 {
            width: 100%;
            text-align: center;
            font-weight: 600;
            font-size: 2em;
        }
        .p3 {
            width: 100%;
            text-align: center;
            font-weight: 700;
            font-size: 3em;
        }
        .p4 {
            width: 100%;
            text-align: center;
            font-size: 1.5em;
            margin: 10px auto 10px;
        }
        .btn {
            display: block;
            width: 60px;
            height: 40px;
            border: none;
            color: white;
            background-color: #114c98;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            margin: 0 auto;
        }
        .btn:hover {
            background-color: #027d0f;
        }
    </style>
</head>
<body>
    <p class="p1">New</p>
    <p class="p2">MacBook Pro</p>
    <p class="p3">SuperChanged for pros.</p>
    <p class="p4">From $1999</p>
    <button class="btn">Buy</button>
</body>
</html>
