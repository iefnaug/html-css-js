<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>responsive</title>
    <style>
        * {
            /*box-sizing: border-box;*/
        }

        .flex-container {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
        }

        .flex-item {
            background-color: #f1f1f1;
            padding: 10px;
            font-size: 30px;
            text-align: center;
            /*width: 100%;*/
            flex: 30%;
        }

        @media screen and (max-width: 600px) {
            /*.flex-container {*/
            /*    flex-direction: column;*/
            /*}*/

            .flex-item {
                flex: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Responsive Flexbox</h1>

    <p>On screens that are 600px wide or less, the columns will stack on top of each other instead of next to eachother.</p>
    <p><strong>Resize the browser window to see the effect.</strong></p>

    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
    </div>
</body>
</html>
