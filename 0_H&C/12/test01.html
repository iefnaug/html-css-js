<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test01</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            margin: 10px;
            max-width: 600px;
            border: 1px solid #888888;
            border-radius: 10px;
        }

        .item {
            padding: 15px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .left {
            font-size: 1.5em;
            font-weight: bold;
        }

        .right {
            padding: 8px 20px;
            background-color: #3A75EC;
            border-radius: 20px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            <span class="left">Home</span>
            <div class="right">14</div>
        </div>
        <div class="item">
            <span class="left">Home</span>
            <div class="right">14</div>
        </div>
        <div class="item">
            <span class="left">Home</span>
            <div class="right">14</div>
        </div>
    </div>
</body>
</html>
