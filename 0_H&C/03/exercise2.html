<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>buttons</title>
</head>
<style>
    .request-button {
        background-color: #FDD115;
        color: black;
        font-size: 16px;
        font-weight: bold;
        height: 46px;
        width: 260px;
        border-radius: 23px;
        border: none;
        transition: opacity 0.2s;
    }
    .request-button:hover {
        opacity: 0.8;
    }
    .request-button:active {
        opacity: 0.6;
    }
</style>
<body>
    <button class="request-button">Add to Cart</button>
</body>
</html>
