<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>from scratch</title>
    <style>
        h1 {
            color: red;
        }

        p,li {
            color: green;
        }

        li {
            /*list-style-type: none;*/
            list-style-type: square;
        }
    </style>
</head>
<body>
    <h1>我是一级标题</h1>

    <p>
        这是一个段落文本。在文本中有一个 <span>span element</span> 并且还有一个
        <a href="http://example.com">链接</a>.
    </p>

    <p>这是第二段。包含了一个 <em>强调</em> 元素。</p>

    <ul>
        <li>项目 1</li>
        <li>项目 2</li>
        <li>项目 <em>三</em></li>
    </ul>
</body>
</html>
