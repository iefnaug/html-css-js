<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .cat {
            width: 200px;
            border-radius: 10px;
        }

        .cat2 {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }

        .cat3 {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
            border-radius: 100px;
        }

        .search-box {
            width: 300px;
            height: 50px;
            border-radius: 10px;
            border: 1px solid #b4aaaa;
            text-indent: 1em;
        }
        .search-box:focus {
            outline: none;
            border-color: #ff6700;
        }
        .search-box2 {
            width: 400px;
            height: 50px;
            border-radius: 25px;
            border: 1px solid #b4aaaa;
            text-indent: 1em;
        }
        .search-box2:focus {
            outline: none;
            border-color: #ff6700;
        }

    </style>
</head>
<body>
    <img class="cat" src="thumbnail/cat.jpg" alt="">
    <p></p>
    <img class="cat2" src="thumbnail/cat.jpg" alt="">
    <p></p>
    <img class="cat3" src="thumbnail/cat.jpg" alt="">
    <p></p>
    <input class="search-box" type="text" placeholder="Search">
    <p></p>
    <input class="search-box2" type="text" placeholder="Search Google And Type A URL">
</body>
</html>
