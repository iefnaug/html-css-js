<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>基于网格线的定位</title>
    <style>
        .wrapper {
            max-width: 700px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 100px;
            row-gap: 20px;
            column-gap: 20px;
            background-color: #3b82f6;
        }
        .wrapper div {
            /*max-width: 200px;*/
            background-color: lightseagreen;
        }

        .wrapper div.box1 {
            /*grid-column: 2/3;*/
            /*grid-row: 1/2;*/

            /*grid-row-start*/
            /*grid-column-start*/
            /*grid-row-end*/
            /*grid-column-end*/
            grid-area: 1/2/2/3;
        }

        .wrapper div.box2 {
            /*grid-column: 1/2;*/
            /*grid-row: 2/3;*/
            grid-area: 2/1/3/2;
        }

        .wrapper div.box3 {
            /*grid-column: 3/4;*/
            /*grid-row: 2/3;*/
            grid-area: 2/3/3/4;
        }

        .wrapper div.box4 {
            /*grid-column: 3/4;*/
            /*grid-row: 2/3;*/
            grid-area: 3/1/4/-1;
        }


        .wrapper2 {
            max-width: 700px;
            background-color: lightcoral;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 100px;
            row-gap: 5px;
            column-gap: 5px;
            grid-template-areas:
                    "hd hd hd hd hd hd"
                    "l l r r r r"
                    "l l ft ft ft .";
        }

        .wrapper2 :nth-child(1) {
            grid-area: hd;
            background-color: #8b5cf6;
        }
        .wrapper2 :nth-child(2) {
            grid-area: l;
            background-color: lightblue;
        }
        .wrapper2 :nth-child(3) {
            grid-area: r;
            background-color: #609275;
        }
        .wrapper2 :nth-child(4) {
            grid-area: ft;
            background-color: lightgrey;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
    </div>
    <br>
    <div class="wrapper2">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
</body>
</html>
