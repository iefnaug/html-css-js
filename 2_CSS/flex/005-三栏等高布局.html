<head>

            padding: 20px;

        .card {

            background-color: #f8fafc;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
        }
    </style>
</head>

<div class="cards">

    <div class="card">卡片2<br>内容很多很多很多很多很多</div>
    <div class="card">卡片3</div>
</div>
</body>
</html>
