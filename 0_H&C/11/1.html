<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>exercise</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 200px);
            gap: 20px;
            margin: 10px;
            padding: 10px;
            background-color: #667eea;
        }

        .item {
            display: grid;
            grid-template-rows: 200px 40px 40px 60px;
            width: 200px;

            background-color: white;
        }

        .item > img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        .item > span {
            font-size: 1.2em;
            font-weight: bold;
            margin: auto 0 auto 10px;
        }

        .item > .head-bar {
            display: grid;
            grid-template-columns: 40px 1fr;
            align-items: center;
            grid-column-gap: 10px;
            margin-left: 10px;
            color: #888888;
        }
        .item > .head-bar > img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }
        .item > button {
            margin: auto 0 auto 10px;
            height: 70%;
            width: 70%;
            border: 0;
            background-color: #3A75EC;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            transition: opacity 0.15s;
        }
        .item > button:hover {
            opacity: 0.8;
        }
        .item > button:active {
            background-color: #609275;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            <img src="../07/thumbnail/cat.jpg" alt="">
            <span>Oliver</span>
            <div class="head-bar">
                <img src="../07/thumbnail/channel-1.jpeg" alt="">
                <span>2 mutual friends</span>
            </div>
            <button>Add Friend</button>
        </div>
        <div class="item">
            <img src="../07/thumbnail/cat.jpg" alt="">
            <span>Oliver</span>
            <div class="head-bar">
                <img src="../07/thumbnail/channel-1.jpeg" alt="">
                <span>2 mutual friends</span>
            </div>
            <button>Add Friend</button>
        </div>
        <div class="item">
            <img src="../07/thumbnail/cat.jpg" alt="">
            <span>Oliver</span>
            <div class="head-bar">
                <img src="../07/thumbnail/channel-1.jpeg" alt="">
                <span>2 mutual friends</span>
            </div>
            <button>Add Friend</button>
        </div>
    </div>
</body>
</html>
