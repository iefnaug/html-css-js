<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dotted rgb(96 139 168);
        }

        .box div {
            width: 100px;
            /*height: 100px;*/
            border: 2px solid rgb(96 139 168);
            border-radius: 5px;
            background-color: rgb(96 139 168 / 0.2);
        }

        .box .one {
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="one">一</div>
        <div>二</div>
        <div>三 <br />具有 <br />额外的 <br />文本</div>
    </div>
</body>
</html>
