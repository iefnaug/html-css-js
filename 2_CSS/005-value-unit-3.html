<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .wrapper {
            width: 400px;
            border: 1px solid lightcoral;
        }
        .box {
            padding: 1em;
            border-radius: 0.5em;
            border: 5px solid rebeccapurple;
            background-color: lightblue;
            width: calc(20% + 100px);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="box">我的宽度是计算出来的。</div>
    </div>
</body>
</html>
